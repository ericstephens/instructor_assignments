name: instructor_assignments
channels:
  - conda-forge
  - defaults
dependencies:
  # Python base
  - python=3.13
  - pip

  # Database
  - sqlalchemy>=2.0.30
  - psycopg2-binary>=2.9.9
  - alembic>=1.13.0

  # API
  - fastapi>=0.111.0
  - uvicorn>=0.29.0
  - pydantic>=2.7.0
  - python-multipart>=0.0.9
  - httpx>=0.27.0

  # Testing
  - pytest>=8.2.0
  - pytest-asyncio>=0.23.0

  # Auth
  - pip:
    - python-jose[cryptography]>=3.3.0
    - passlib[bcrypt]>=1.7.4

  # Utilities
  - python-dotenv>=1.0.0
